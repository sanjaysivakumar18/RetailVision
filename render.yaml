services:
  - type: web
    name: retailvision-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: YOLO_CONFIG_DIR
        value: /tmp/ultralytics
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
